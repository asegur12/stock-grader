# Refreshes the stock data and publishes the site to GitHub Pages.
# Runs: on every push to main, every weekday after U.S. market close, or by hand
# (Actions tab -> "Update data and deploy" -> Run workflow).
name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = 4:30pm New York (winter) / 5:30pm (summer)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # If Yahoo is unreachable, keep the committed data.json instead of failing.
      - name: Fetch fresh stock data
        run: python scripts/fetch_data.py || echo "::warning::Fetch failed; deploying last committed data.json"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
